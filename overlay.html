<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catching Breaks – OBS Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet">
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #C9A84C;
    --gold-light: #F0D080;
    --gold-dim: #7A6330;
    --black: #0A0A0A;
    --dark: #111111;
    --dark2: #1A1A1A;
    --white: #F5F5F5;
    --grey: #888;
  }

  body {
    width: 1080px;
    height: 960px;
    background: transparent;
    overflow: hidden;
    font-family: 'Barlow Condensed', sans-serif;
    position: relative;
  }

  /* ── BORDER FRAME ── */
  .frame {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 100;
  }

  /* Corner accents */
  .corner {
    position: absolute;
    width: 60px;
    height: 60px;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: var(--gold);
  }
  .corner::before { width: 100%; height: 3px; }
  .corner::after  { width: 3px; height: 100%; }

  .corner.tl { top: 24px; left: 24px; }
  .corner.tr { top: 24px; right: 24px; transform: scaleX(-1); }
  .corner.bl { bottom: 24px; left: 24px; transform: scaleY(-1); }
  .corner.br { bottom: 24px; right: 24px; transform: scale(-1); }

  /* Thin edge lines */
  .edge {
    position: absolute;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }
  .edge.top    { top: 24px;    left: 84px; right: 84px; height: 1px; }
  .edge.bottom { bottom: 24px; left: 84px; right: 84px; height: 1px; }
  .edge.left   { left: 24px;   top: 84px; bottom: 84px; width: 1px;
                 background: linear-gradient(180deg, transparent, var(--gold-dim), transparent); }
  .edge.right  { right: 24px;  top: 84px; bottom: 84px; width: 1px;
                 background: linear-gradient(180deg, transparent, var(--gold-dim), transparent); }

  /* ── TOP LOGO BAR ── */
  .logo-bar {
    position: absolute;
    top: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    animation: fadeDown 1s ease forwards;
    z-index: 50;
  }

  .logo-bar .logo-img {
    width: 160px;
    height: 160px;
    object-fit: contain;
    filter: drop-shadow(0 0 16px rgba(201,168,76,0.5));
    animation: goldPulse 4s ease-in-out infinite;
  }

  .logo-bar .tagline {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 6px;
    color: var(--gold-dim);
    text-transform: uppercase;
  }

  .gold-divider {
    width: 200px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin-top: 0;
  }

  /* ── BREAK BOARD ── */
  .break-board {
    position: absolute;
    top: 230px;
    left: 50%;
    transform: translateX(-50%);
    width: 980px;
    background: rgba(10,10,10,0.85);
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 0;
    animation: fadeUp 1.2s ease forwards;
    z-index: 50;
  }

  /* Sold count overlay centered above camera hole */
  .sold-count-overlay {
    grid-column: 4 / 8;
    grid-row: 1 / 2;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    pointer-events: none;
  }

  .sold-count-overlay span {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--gold);
  }

  /* ── U-SHAPE GRID ──
     10 cols × 7 rows
     Left arm  : cols 1-3, rows 1-5  (15 slots)
     Right arm : cols 8-10, rows 1-5 (15 slots)
     Bottom    : cols 1-10, rows 6-7 (filled left→right as needed)
     Centre    : cols 4-7, rows 1-5  ← OPEN (camera hole)
  */
  .team-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(7, 1fr);
    gap: 8px;
    height: 550px;
  }

  /* Dashed camera placeholder */
  .camera-hole {
    grid-column: 4 / 8;
    grid-row: 2 / 6;
    border: 2px dashed var(--gold-dim);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.30;
    pointer-events: none;
  }

  .camera-hole span {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 3px;
    color: var(--gold-dim);
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }

  .team-slot {
    background: var(--dark2);
    border: 1px solid #2A2A2A;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    position: relative;
    transition: border-color 0.2s, background 0.2s;
    overflow: hidden;
    min-height: 0;
  }

  .team-slot:hover {
    border-color: var(--gold-dim);
  }

  .team-slot .team-logo {
    width: 72%;
    height: 72%;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.6));
    transition: transform 0.15s;
  }

  .team-slot:hover .team-logo {
    transform: scale(1.08);
  }

  /* Sold state */
  .team-slot.sold {
    background: rgba(201,168,76,0.08);
    border-color: var(--gold);
  }


  /* ── ALL SOLD: overlays shrink to bottom banner, logos reappear ── */
  .all-sold .sold-overlay {
    inset: auto 0 0 0;       /* stick to bottom only */
    height: auto;
    background: rgba(0,0,0,0.82);
    padding: 3px 2px;
    transition: inset 0.6s ease, height 0.6s ease;
    animation: none;
  }

  .all-sold .sold-x {
    display: none;
  }

  .all-sold .sold-x-svg {
    display: none;           /* hide X lines once logos are revealed */
  }

  .all-sold .sold-username {
    font-size: 9px;
    letter-spacing: 0.5px;
    min-height: 0;
  }

  /* Username overlay shown after click */
  .sold-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    background: rgba(0,0,0,0.30);
    animation: popIn 0.3s cubic-bezier(0.36,0.07,0.19,0.97);
    padding: 4px;
    gap: 2px;
  }

  /* SVG X strikethrough drawn over the logo */
  .sold-x-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .sold-x-svg line {
    stroke: var(--gold);
    stroke-width: 3;
    stroke-linecap: round;
    opacity: 0.9;
  }

  .sold-x {
    display: none; /* replaced by SVG */
  }

  .sold-username {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--white);
    text-align: center;
    word-break: break-all;
    max-width: 100%;
    padding: 0 4px;
    min-height: 14px;
  }

  .sold-username .cursor {
    display: inline-block;
    width: 1px;
    height: 11px;
    background: var(--gold);
    margin-left: 1px;
    vertical-align: middle;
    animation: blink 0.7s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }

  /* ── LOWER THIRD ── */
  .lower-third {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 980px;
    z-index: 50;
    animation: fadeUp 1.4s ease forwards;
  }

  .lt-inner {
    background: linear-gradient(135deg, rgba(10,10,10,0.95) 0%, rgba(26,26,26,0.9) 100%);
    border: 1px solid var(--gold-dim);
    border-left: 4px solid var(--gold);
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .lt-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .lt-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
  }

  .lt-show-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 3px;
    color: var(--white);
    line-height: 1;
  }

  .lt-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .lt-stat-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--grey);
    text-transform: uppercase;
  }

  .lt-stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 2px;
    color: var(--gold);
    line-height: 1;
  }

  /* ── SOLD TICKER ── */
  .ticker-wrap {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    width: 980px;
    overflow: hidden;
    height: 32px;
    z-index: 50;
  }

  .ticker-track {
    display: flex;
    gap: 60px;
    white-space: nowrap;
    animation: ticker 18s linear infinite;
  }

  .ticker-item {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    color: var(--gold-dim);
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .ticker-item span {
    color: var(--gold);
  }


  /* ── INSTRUCTIONS ── */
  .instructions {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    border: 1px solid var(--gold);
    padding: 32px 40px;
    border-radius: 6px;
    text-align: center;
    z-index: 200;
    max-width: 600px;
  }

  .instructions h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--gold);
    letter-spacing: 4px;
    margin-bottom: 12px;
  }

  .instructions p {
    font-size: 16px;
    color: var(--grey);
    line-height: 1.6;
    margin-bottom: 8px;
  }

  .instructions .hint {
    font-size: 13px;
    color: var(--gold-dim);
    letter-spacing: 2px;
    margin-top: 16px;
  }

  .close-btn {
    margin-top: 20px;
    background: var(--gold);
    color: var(--black);
    border: none;
    padding: 10px 32px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 3px;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.2s;
  }

  .close-btn:hover { background: var(--gold-light); }

  /* ── ANIMATIONS ── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  @keyframes popIn {
    0%   { transform: scale(1.4); opacity: 0; }
    60%  { transform: scale(0.95); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes ticker {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  @keyframes goldPulse {
    0%, 100% { text-shadow: 0 0 20px rgba(201,168,76,0.3); }
    50%       { text-shadow: 0 0 50px rgba(201,168,76,0.8); }
  }

  .logo-bar .brand {
    animation: goldPulse 4s ease-in-out infinite;
  }


</style>
</head>

<script>
  // Each team has abbr (for prompt text), name, and official NBA team ID
  // Logo URL: https://cdn.nba.com/logos/nba/{id}/global/L/logo.svg
  const NBA_TEAMS = [
    { abbr: 'ATL', name: 'Hawks',      id: 1610612737 },
    { abbr: 'BOS', name: 'Celtics',    id: 1610612738 },
    { abbr: 'BKN', name: 'Nets',       id: 1610612751 },
    { abbr: 'CHA', name: 'Hornets',    id: 1610612766 },
    { abbr: 'CHI', name: 'Bulls',      id: 1610612741 },
    { abbr: 'CLE', name: 'Cavaliers',  id: 1610612739 },
    { abbr: 'DAL', name: 'Mavericks',  id: 1610612742 },
    { abbr: 'DEN', name: 'Nuggets',    id: 1610612743 },
    { abbr: 'DET', name: 'Pistons',    id: 1610612765 },
    { abbr: 'GSW', name: 'Warriors',   id: 1610612744 },
    { abbr: 'HOU', name: 'Rockets',    id: 1610612745 },
    { abbr: 'IND', name: 'Pacers',     id: 1610612754 },
    { abbr: 'LAC', name: 'Clippers',   id: 1610612746 },
    { abbr: 'LAL', name: 'Lakers',     id: 1610612747 },
    { abbr: 'MEM', name: 'Grizzlies',  id: 1610612763 },
    { abbr: 'MIA', name: 'Heat',       id: 1610612748 },
    { abbr: 'MIL', name: 'Bucks',      id: 1610612749 },
    { abbr: 'MIN', name: 'T-Wolves',   id: 1610612750 },
    { abbr: 'NOP', name: 'Pelicans',   id: 1610612740 },
    { abbr: 'NYK', name: 'Knicks',     id: 1610612752 },
    { abbr: 'OKC', name: 'Thunder',    id: 1610612760 },
    { abbr: 'ORL', name: 'Magic',      id: 1610612753 },
    { abbr: 'PHI', name: '76ers',      id: 1610612755 },
    { abbr: 'PHX', name: 'Suns',       id: 1610612756 },
    { abbr: 'POR', name: 'Blazers',    id: 1610612757 },
    { abbr: 'SAC', name: 'Kings',      id: 1610612758 },
    { abbr: 'SAS', name: 'Spurs',      id: 1610612759 },
    { abbr: 'TOR', name: 'Raptors',    id: 1610612761 },
    { abbr: 'UTA', name: 'Jazz',       id: 1610612762 },
    { abbr: 'WAS', name: 'Wizards',    id: 1610612764 },
  ];

  // ─── WHATNOT RANDOMIZER AUTO-ASSIGN ────────────────────────────────────────
  // Maps team name variants → canonical abbr for fuzzy matching
  const TEAM_NAME_MAP = {};
  NBA_TEAMS.forEach(t => {
    TEAM_NAME_MAP[t.abbr.toLowerCase()]  = t.abbr;
    TEAM_NAME_MAP[t.name.toLowerCase()]  = t.abbr;
    // common aliases
    const aliases = {
      'sixers': 'PHI', '76ers': 'PHI',
      'wolves': 'MIN', 'timberwolves': 'MIN',
      'blazers': 'POR', 'trailblazers': 'POR',
      'knicks': 'NYK',
    };
    Object.assign(TEAM_NAME_MAP, aliases);
  });

  function findTeamSlotByName(teamName) {
    const key = teamName.trim().toLowerCase();
    const abbr = TEAM_NAME_MAP[key];
    if (!abbr) return null;
    // find the unsold slot whose img alt matches
    const slots = document.querySelectorAll('.team-slot');
    for (const slot of slots) {
      if (slot.dataset.sold === 'true') continue;
      const img = slot.querySelector('.team-logo');
      const fallback = slot.querySelector('.team-abbr-fallback');
      const slotName = (img?.alt || fallback?.textContent || '').toLowerCase();
      const team = NBA_TEAMS.find(t => t.abbr === abbr);
      if (team && (slotName === team.name.toLowerCase() || slotName === team.abbr.toLowerCase())) {
        return slot;
      }
    }
    return null;
  }

  // ─── WHATNOT URL LISTENER ──────────────────────────────────────────────────
  // Listens for URL hash changes in the format:
  //   #assign?team=Hawks&user=username
  // Whatnot overlays can trigger this by navigating to the hash.
  function handleHashChange() {
    const hash = window.location.hash;
    if (!hash.startsWith('#assign')) return;
    try {
      const params = new URLSearchParams(hash.slice('#assign?'.length));
      const teamParam = params.get('team');
      const userParam = params.get('user');
      if (teamParam && userParam) {
        autoAssign(teamParam, userParam);
        // Clear hash so repeat fires work
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
    } catch (e) { /* ignore malformed hashes */ }
  }

  window.addEventListener('hashchange', handleHashChange);

  // ─── POSTMESSAGE LISTENER ─────────────────────────────────────────────────
  // Listens for postMessage events from parent window (e.g. browser source wrapper).
  // Expected format: { type: 'catchingBreaks', team: 'Hawks', user: 'username' }
  window.addEventListener('message', (event) => {
    const d = event.data;
    if (d && d.type === 'catchingBreaks' && d.team && d.user) {
      autoAssign(d.team, d.user);
    }
  });

  let soldCount = 0;
  const total = NBA_TEAMS.length;

  // ─── CORE AUTO-ASSIGN FUNCTION ────────────────────────────────────────────
  // Marks the given team as sold to the given user, with typewriter animation.
  function autoAssign(teamName, username) {
    const slot = findTeamSlotByName(teamName);
    if (!slot || slot.dataset.sold === 'true') return;

    slot.dataset.sold = 'true';
    slot.dataset.username = username.trim();
    slot.classList.add('sold');

    const overlay = document.createElement('div');
    overlay.className = 'sold-overlay';
    overlay.innerHTML = `
      <svg class="sold-x-svg" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="8" y1="8" x2="92" y2="92"/>
        <line x1="92" y1="8" x2="8" y2="92"/>
      </svg>
      <div class="sold-username"></div>`;
    slot.appendChild(overlay);

    typewriter(overlay.querySelector('.sold-username'), username.trim().toUpperCase());
    soldCount++;

    document.getElementById('soldCount').textContent = `${soldCount} / ${total} Sold`;
    document.getElementById('remaining').textContent = total - soldCount;
    checkAllSold();
  }

  // ─── EXPOSE FOR CONSOLE / EXTERNAL USE ────────────────────────────────────
  // OBS browser source can call: window.catchingBreaksAssign('Hawks', 'username')
  window.catchingBreaksAssign = autoAssign;

  /* Typewriter helper — types `text` into `el`, then removes blinking cursor */
  function typewriter(el, text, speed = 80) {
    el.innerHTML = '<span class="cursor"></span>';
    let i = 0;
    const cursor = el.querySelector('.cursor');
    const interval = setInterval(() => {
      if (i < text.length) {
        cursor.insertAdjacentText('beforebegin', text[i]);
        i++;
      } else {
        clearInterval(interval);
        cursor.style.animation = 'none';
        cursor.style.opacity = '0';
      }
    }, speed);
  }

  function uShapePositions(count) {
    const positions = [];
    for (let col = 1; col <= 3; col++)
      for (let row = 1; row <= 5; row++) positions.push({ col, row });
    for (let col = 8; col <= 10; col++)
      for (let row = 1; row <= 5; row++) positions.push({ col, row });
    for (let row = 6; row <= 7; row++)
      for (let col = 1; col <= 10; col++) positions.push({ col, row });
    return positions.slice(0, count);
  }

  function buildGrid() {
    const grid = document.getElementById('teamGrid');
    const positions = uShapePositions(NBA_TEAMS.length);

    NBA_TEAMS.forEach((team, i) => {
      const pos = positions[i];
      const slot = document.createElement('div');
      slot.className = 'team-slot';
      slot.dataset.sold = 'false';
      slot.dataset.teamAbbr = team.abbr;
      slot.style.gridColumn = pos.col;
      slot.style.gridRow = pos.row;
      const logoUrl = `https://cdn.nba.com/logos/nba/${team.id}/global/L/logo.svg`;
      slot.innerHTML = `
        <img class="team-logo"
             src="${logoUrl}"
             alt="${team.name}"
             title="${team.abbr} – ${team.name}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
        />
        <span class="team-abbr-fallback" style="display:none;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--white)">${team.abbr}</span>
      `;
      slot.addEventListener('click', () => handleSlotClick(slot));
      grid.appendChild(slot);
    });
  }

  /* When all 30 slots are sold:
     - Remove all ✕ marks (X's are hidden)
     - Shrink overlays to bottom banner so logos show through */
  function checkAllSold() {
    const grid = document.getElementById('teamGrid');
    if (soldCount === total) {
      grid.classList.add('all-sold');
    } else {
      grid.classList.remove('all-sold');
    }
  }

  function handleSlotClick(slot) {
    const isSold = slot.dataset.sold === 'true';

    if (!isSold) {
      const teamName = slot.querySelector('.team-logo')?.alt || slot.querySelector('.team-abbr-fallback')?.textContent || 'this team';
      const username = prompt(`Who won ${teamName}?`);
      if (username === null || username.trim() === '') return;

      slot.dataset.sold = 'true';
      slot.dataset.username = username.trim();
      slot.classList.add('sold');

      const overlay = document.createElement('div');
      overlay.className = 'sold-overlay';
      overlay.innerHTML = `
        <svg class="sold-x-svg" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="8" y1="8" x2="92" y2="92"/>
          <line x1="92" y1="8" x2="8" y2="92"/>
        </svg>
        <div class="sold-username"></div>`;
      slot.appendChild(overlay);

      typewriter(overlay.querySelector('.sold-username'), username.trim().toUpperCase());
      soldCount++;
    } else {
      slot.dataset.sold = 'false';
      slot.classList.remove('sold');
      const overlay = slot.querySelector('.sold-overlay');
      if (overlay) overlay.remove();
      soldCount--;
    }

    document.getElementById('soldCount').textContent = `${soldCount} / ${total} Sold`;
    document.getElementById('remaining').textContent = total - soldCount;
    checkAllSold();
  }

  buildGrid();
</script>



<script>
  // Populate team dropdown
  // team dropdown built in control.html only

  // ─── SERVER SYNC (overlay only — polls for assignments) ──────────────────
  const SERVER = '';
  let lastSeenCount = 0;

  async function pollServer() {
    try {
      const res = await fetch(SERVER + '/state');
      if (!res.ok) return;
      const data = await res.json();

      if (data.resetFlag) {
        hardReset();
        lastSeenCount = 0;
        return;
      }

      const assignments = data.assignments || [];
      if (assignments.length > lastSeenCount) {
        for (let i = lastSeenCount; i < assignments.length; i++) {
          const a = assignments[i];
          const slot = findTeamSlotByName(a.team);
          if (slot && slot.dataset.sold !== 'true') {
            autoAssign(a.team, a.user);
          }
        }
        lastSeenCount = assignments.length;
      }
    } catch(e) { /* server not running yet */ }
  }

  setInterval(pollServer, 800);
  pollServer();

  function hardReset() {
    document.querySelectorAll('.team-slot').forEach(slot => {
      slot.dataset.sold = 'false';
      slot.classList.remove('sold');
      const ov = slot.querySelector('.sold-overlay');
      if (ov) ov.remove();
    });
    soldCount = 0;
    lastSeenCount = 0;
    document.getElementById('soldCount').textContent = '0 / ' + total + ' Sold';
    document.getElementById('remaining').textContent = total;
    document.getElementById('teamGrid').classList.remove('all-sold');
  }
</script>

</body>
</html>
